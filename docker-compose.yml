# Transweb — Fleetbase distribution for Mozambique (see NOTICE-TRANSWEB.md).
# Development compose: see branding/ROADMAP-MOCAMBIQUE.md §Segurança before exposing it publicly.
services:
  cache:
    image: redis:4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    image: mysql:8.0-oracle
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - "./docker/database/:/docker-entrypoint-initdb.d/"
      - "./docker/database/mysql:/var/lib/mysql"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "fleetbase"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  socket:
    image: socketcluster/socketcluster:v17.4.0
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "38000:8000"
    environment:
      SOCKETCLUSTER_WORKERS: 10
      SOCKETCLUSTER_BROKERS: 10
      # SOCKETCLUSTER_OPTIONS can be set via docker-compose.override.yml for specific environments
      # For production, use: SOCKETCLUSTER_OPTIONS: '{"origins":"https://yourdomain.com:*"}'
      # For development, use: SOCKETCLUSTER_OPTIONS: '{"origins":"http://localhost:*"}'

  scheduler:
    image: transweb/transweb-api:local
    build:
      context: .
      dockerfile: docker/transweb-api/Dockerfile
    command: ["go-crond", "--verbose", "root:./crontab"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql://root@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
      APP_NAME: Transweb
      MAIL_FROM_NAME: Transweb
      TRANSWEB_CONSOLE_URL: http://localhost:4200
    depends_on:
      - database
      - cache

  queue:
    image: transweb/transweb-api:local
    build:
      context: .
      dockerfile: docker/transweb-api/Dockerfile
    command: ["php", "artisan", "queue:work"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:status"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      DATABASE_URL: "mysql://root@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
      APP_NAME: Transweb
      MAIL_FROM_NAME: Transweb
      TRANSWEB_CONSOLE_URL: http://localhost:4200
    depends_on:
      - database
      - cache

  console:
    image: transweb/transweb-console:local
    restart: unless-stopped
    build:
      context: ./console
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: development
    ports:
      - "4200:4200"
    volumes:
      - ./console/fleetbase.config.json:/usr/share/nginx/html/fleetbase.config.json

  application:
    restart: unless-stopped
    image: transweb/transweb-api:local
    build:
      context: .
      dockerfile: docker/transweb-api/Dockerfile
    volumes:
      - ./api/.env:/fleetbase/api/.env
      - ./api/storage/app:/fleetbase/api/storage/app
    environment:
      ENVIRONMENT: development
      DATABASE_URL: "mysql://root@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
      SESSION_DOMAIN: localhost
      BROADCAST_DRIVER: socketcluster
      MAIL_FROM_NAME: Transweb
      APP_NAME: Transweb
      # Public console address; used for default logo/icon URLs in emails (set to your domain in production)
      TRANSWEB_CONSOLE_URL: http://localhost:4200
      LOG_CHANNEL: daily
      REGISTRY_HOST: https://registry.fleetbase.io
      REGISTRY_PREINSTALLED_EXTENSIONS: "true"
      OSRM_HOST: https://router.project-osrm.org
    depends_on:
      - database
      - cache
      - queue

  httpd:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/httpd/Dockerfile
    ports:
      - "8000:80"
    depends_on:
      - application
